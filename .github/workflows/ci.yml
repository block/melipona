name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --all-targets
      - run: cargo +stable test --locked --all-targets --features serde_json/preserve_order,rustls/custom-provider
      - run: cargo +stable test --locked --doc
      - run: cargo +stable clippy --locked --all-targets --features mcp -- -D warnings
      - run: cargo +stable test --locked --all-targets --features mcp
      - run: cargo +stable test --locked --all-targets --features mcp,serde_json/preserve_order,rustls/custom-provider
      - run: cargo +stable test --locked --doc --features mcp
